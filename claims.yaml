    status: OUT_OF_DATE
    cause: source_check
    evidence_date: undated
    observed: 2026-08-12
    evidence: "CodeRabbit's pricing page reads '5* PR reviews per developer per hour' (Pro Plus 10/hour, Enterprise 12/hour). The published claim omits the time unit."
